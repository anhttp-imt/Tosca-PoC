<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tosca PoC</title>
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="app-header">
    <h1>Tosca PoC</h1>
    <span class="subtitle">Object Identification (Scan)</span>
  </header>

  <main>
    <div class="ext-id-row">
      <span class="hint">Extension ID (paste into Web App to connect):</span>
      <div class="ext-id-copy">
        <code id="ext-id"></code>
        <button id="btn-copy-id" class="btn btn-ghost">Copy</button>
      </div>
    </div>

    <div class="toolbar">
      <button id="btn-scan-toggle" class="btn btn-primary">Start Scan</button>
    </div>
    <p class="hint">Enable Scan then hover/click elements on the open page to capture them into the Object Repository. Test Builder / Record / Run / Report are now in a separate Web App (see README).</p>

    <ul id="object-list" class="item-list"></ul>
    <p id="object-empty" class="empty-hint">No objects yet.</p>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
