<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Tosca PoC — Web App</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="app-header">
    <h1>Tosca PoC</h1>
    <span class="subtitle">Test Builder · Suite · Record &amp; Playback · Run &amp; Report</span>
  </header>

  <section class="connect-bar">
    <input id="ext-id-input" type="text" placeholder="Dán Extension ID từ Side Panel..." />
    <button id="btn-connect" class="btn btn-primary">Connect</button>
    <span id="connect-status" class="status-chip status-fail">No connection</span>
  </section>

  <section class="target-bar">
    <label for="target-tab-select">Target Tab:</label>
    <select id="target-tab-select"></select>
    <button id="btn-refresh-tabs" class="btn btn-ghost">⟳ Refresh</button>
  </section>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="builder">Test Builder</button>
    <button class="tab-btn" data-tab="suite">Suite</button>
    <button class="tab-btn" data-tab="run">Run</button>
    <button class="tab-btn" data-tab="report">Report</button>
  </nav>

  <main>
    <section id="tab-builder" class="tab-panel active">
      <div class="toolbar">
        <select id="testcase-select"></select>
        <button id="btn-new-testcase" class="btn">+ Create New Testcase</button>
      </div>
      <div class="toolbar">
        <button id="btn-record-toggle" class="btn btn-danger" disabled>Start Record</button>
        <button id="btn-delete-testcase" class="btn btn-ghost" disabled>Delete Testcase</button>
      </div>
      <ol id="step-list" class="item-list"></ol>
      <p id="step-empty" class="empty-hint">No step</p>

      <div class="add-step-form">
        <select id="step-object-select"></select>
        <select id="step-action-select">
          <option value="click">Click</option>
          <option value="input">Input</option>
          <option value="select">Select</option>
          <option value="verify">Verify Text</option>
          <option value="wait">Wait</option>
          <option value="sendkey">Send Key</option>
        </select>
        <input id="step-value-input" type="text" placeholder="Value / Expected text / Ms" />
        <button id="btn-add-step" class="btn">+ Add Step</button>
      </div>
    </section>

    <section id="tab-suite" class="tab-panel">
      <div class="toolbar">
        <select id="suite-select"></select>
        <button id="btn-new-suite" class="btn">+ Create New Suite</button>
        <button id="btn-delete-suite" class="btn btn-ghost" disabled>Delete Suite</button>
      </div>
      <ol id="suite-item-list" class="item-list"></ol>
      <p id="suite-empty" class="empty-hint">No test suite</p>

      <div class="add-step-form">
        <select id="suite-add-testcase-select"></select>
        <button id="btn-suite-add-testcase" class="btn">+ Add to Suite</button>
      </div>
    </section>

    <section id="tab-run" class="tab-panel">
      <div class="toolbar">
        <select id="run-mode-select">
          <option value="testcase">Run each test case</option>
          <option value="suite">Run suite</option>
        </select>
      </div>
      <div class="toolbar" id="run-mode-testcase">
        <select id="run-testcase-select"></select>
      </div>
      <div class="toolbar" id="run-mode-suite" style="display:none;">
        <select id="run-suite-select"></select>
      </div>
      <div class="toolbar">
        <button id="btn-run-testcase" class="btn btn-primary">▶ Run</button>
        <button id="btn-cancel-run" class="btn btn-danger" disabled>⏹ Cancel</button>
      </div>

      <ol id="suite-progress-list" class="item-list"></ol>
      <ol id="run-step-list" class="item-list"></ol>
      <p id="run-empty" class="empty-hint">Select a test case or suite, then click Run.</p>
    </section>

    <section id="tab-report" class="tab-panel">
      <div class="toolbar">
        <button id="btn-clear-reports" class="btn btn-ghost">Delete History</button>
        <button id="btn-clear-storage" class="btn btn-ghost btn-danger">🗑 Delete Storage</button>
      </div>
      <div id="report-list"></div>
      <p id="report-empty" class="empty-hint">No Test Run</p>
    </section>
  </main>

  <!-- Step Edit Modal -->
  <div id="step-edit-overlay" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Edit Step</h3>
        <button id="btn-modal-close" class="btn-ghost" title="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label>Object</label>
          <select id="edit-step-object-select"></select>
        </div>
        <div class="form-row">
          <label>Action</label>
          <select id="edit-step-action-select">
            <option value="click">Click</option>
            <option value="input">Input</option>
            <option value="select">Select</option>
            <option value="verify">Verify Text</option>
            <option value="wait">Wait</option>
            <option value="sendkey">Send Key</option>
          </select>
        </div>
        <div class="form-row">
          <label>Value / Expected text / Ms</label>
          <input id="edit-step-value-input" type="text" placeholder="Value" />
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-modal-cancel" class="btn">Discard</button>
        <button id="btn-modal-save" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
